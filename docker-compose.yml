services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: insightflow
      POSTGRES_USER: insightflow
      POSTGRES_PASSWORD: insightflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightflow -d insightflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - insightflow_postgres:/var/lib/postgresql/data

volumes:
  insightflow_postgres:
